name: fono_terapia
description: Um aplicativo para pacientes treinar a fala.

publish_to: 'none'

version: 0.0.1+8

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  shared_preferences: ^2.5.3
  path: ^1.9.1
  sqflite: ^2.4.2
  audioplayers: ^6.4.0
  async: ^2.13.0
  characters: ^1.4.0
  diacritic: ^0.1.6

  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.6
  provider: ^6.1.5
  cloud_firestore: ^5.6.8
  in_app_purchase: ^3.2.3

flutter_launcher_icons:
  image_path: "assets/app_assets/app_icon.png"
  ios: true
  # android: "launcher_icon"
  adaptative_icon_background: "#FFFFFF"
  adaptative_icon_foreground: "assets/app_assets/app_icon.png"
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
  - assets/app_assets/
  - assets/app_assets/sub_categories/
  - assets/db_images/
  - assets/db_audios/

  fonts:
    - family: LexendDeca
      fonts:
        - asset: assets/fonts/LexendDeca-Regular.ttf